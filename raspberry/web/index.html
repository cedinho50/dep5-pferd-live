<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der ungezähmte Horizont (Live)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #hinweis { position: fixed; left: 0; right: 0; bottom: 4vh; text-align: center;
    color: #888; font: 2vw Segoe UI, Arial, sans-serif; display: none; }
</style>
</head>
<body>
<video id="video" muted autoplay playsinline></video>
<div id="hinweis">Stream wird geladen …</div>
<script src="hls.min.js"></script>
<script>
  var QUELLE = 'hls/stream.m3u8';
  var video = document.getElementById('video');
  var hinweis = document.getElementById('hinweis');
  var hls = null;

  function zeigeHinweis(an) { hinweis.style.display = an ? 'block' : 'none'; }

  function starten() {
    zeigeHinweis(true);
    if (hls) { hls.destroy(); hls = null; }

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3, manifestLoadingMaxRetry: 2 });
      hls.loadSource(QUELLE + '?t=' + Date.now());
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () { video.play().catch(function () {}); });
      hls.on(Hls.Events.ERROR, function (e, data) {
        if (data.fatal) { setTimeout(starten, 10000); }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = QUELLE;
      video.play().catch(function () {});
    }
  }

  video.addEventListener('playing', function () { zeigeHinweis(false); });

  // Steht das Bild länger als 30 Sekunden, Player neu starten
  var letzteZeit = -1;
  setInterval(function () {
    if (video.currentTime === letzteZeit) { starten(); }
    letzteZeit = video.currentTime;
  }, 30000);

  // Sicherheitshalber alle 6 Stunden die ganze Seite neu laden
  setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);

  starten();
</script>
</body>
</html>
