server {
    listen 80;
    server_name _;

    # Webseite und Player
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Playlist des Videostreams: nie zwischenspeichern
    location ~ ^/hls/.+\.m3u8$ {
        root /;
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Cache-Control "no-cache, no-store";
    }

    # Videostücke (liegen im Arbeitsspeicher, siehe docker-compose.yml)
    location ~ ^/hls/.+\.ts$ {
        root /;
        types { video/mp2t ts; }
        add_header Cache-Control "public, max-age=60";
    }
}
