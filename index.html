<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Der ungezähmte Horizont (Live)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<iframe
  src="https://www.youtube-nocookie.com/embed/0at5Han4CPA?autoplay=1&mute=1&controls=0&playsinline=1&rel=0"
  title="Der ungezähmte Horizont, Livestream"
  allow="autoplay; encrypted-media; picture-in-picture"
  referrerpolicy="strict-origin-when-cross-origin"
  allowfullscreen></iframe>
<script>
  // Seite alle 6 Stunden neu laden, falls der Stream kurz unterbrochen war
  setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);
</script>
</body>
</html>
